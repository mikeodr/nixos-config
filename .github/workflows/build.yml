# Build every nixosConfiguration and push the closures to the Attic cache on
# forge, so deploy-rs (remoteBuild = true) substitutes instead of building.
#
# One job per system (not per host): all hosts of a system are built in a
# single `nix build`, so shared derivations (Tailscale's Go toolchain,
# tailscale, sops-install-secrets, the i915 DKMS module, ...) build once.
#
# - Pull requests: build only (GitHub Actions cache via Magic Nix Cache).
# - main: also join the tailnet as tag:ci (GitHub OIDC -> Tailscale workload
#   identity, subject repo:mikeodr/nixos-config:ref:refs/heads/main), pull
#   from and push to forge.
#
# Secrets: TS_OAUTH_CLIENT_ID, TS_AUDIENCE, ATTIC_TOKEN (--pull home --push home)
name: build-hosts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ATTIC_ENDPOINT: https://forge.cerberus-basilisk.ts.net
  ATTIC_CACHE: home
  PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  hosts:
    name: Discover systems
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      # Upstream Nix: Determinate Nix would log in to FlakeHub with the job's
      # OIDC token and 401 on cache.flakehub.com (no FlakeHub Cache plan).
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
      - id: matrix
        name: List nixosConfigurations
        run: |
          # One entry per system: { system, runner, hosts = "a b c" }.
          # shellcheck disable=SC2016 # ${n}/${s} are Nix interpolation
          matrix=$(nix eval --json .#nixosConfigurations --apply 'cs:
            let
              bySystem = builtins.groupBy
                (n: cs.${n}.pkgs.stdenv.hostPlatform.system)
                (builtins.attrNames cs);
            in map (s: {
              system = s;
              runner = if s == "aarch64-linux" then "ubuntu-24.04-arm" else "ubuntu-latest";
              hosts = builtins.concatStringsSep " " bySystem.${s};
            }) (builtins.attrNames bySystem)')
          echo "$matrix" | jq .
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.system }}
    needs: hosts
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write # Tailscale workload identity federation
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.hosts.outputs.matrix) }}
    steps:
      # Must run before Nix is installed; frees runner disk for /nix.
      - uses: wimpysworld/nothing-but-nix@v12

      - uses: actions/checkout@v7

      # Upstream Nix: Determinate Nix would log in to FlakeHub with the job's
      # OIDC token and 401 on cache.flakehub.com (no FlakeHub Cache plan).
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false

      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false

      - name: Join tailnet
        if: env.PUSH == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: forge.cerberus-basilisk.ts.net

      - name: Configure Attic
        if: env.PUSH == 'true'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          nix build --inputs-from . nixpkgs#attic-client -o "$RUNNER_TEMP/attic-client"
          echo "$RUNNER_TEMP/attic-client/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/attic-client/bin/attic" login forge "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"
          # Adds forge as a substituter (+ netrc) for this runner's builds.
          "$RUNNER_TEMP/attic-client/bin/attic" use "forge:$ATTIC_CACHE"

      - name: Build ${{ matrix.hosts }}
        env:
          HOSTS: ${{ matrix.hosts }}
        run: |
          installables=()
          for h in $HOSTS; do
            installables+=(".#nixosConfigurations.$h.config.system.build.toplevel")
          done
          # --keep-going: one broken host doesn't stop the others building.
          nix build -L --keep-going --no-link "${installables[@]}"

      - name: Collect results
        if: always()
        env:
          HOSTS: ${{ matrix.hosts }}
        run: |
          {
            echo "### ${{ matrix.system }}"
            echo "| Host | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          : > "$RUNNER_TEMP/built-paths"
          for h in $HOSTS; do
            # Eval the store path, then check it exists locally (never builds).
            if ! out=$(nix eval --raw ".#nixosConfigurations.$h.config.system.build.toplevel.outPath"); then
              echo "| $h | ❌ eval failed |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if nix path-info "$out" >/dev/null 2>&1; then
              echo "$out" >> "$RUNNER_TEMP/built-paths"
              echo "| $h | ✅ built |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $h | ❌ failed |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          cat "$RUNNER_TEMP/built-paths"

      - name: Push to Attic
        # Push whatever built, even if another host on this system failed.
        if: always() && env.PUSH == 'true'
        run: |
          if [ ! -s "$RUNNER_TEMP/built-paths" ]; then
            echo "Nothing built; nothing to push."
            exit 0
          fi
          # Paths signed by cache.nixos.org or already in the cache are skipped.
          xargs attic push "forge:$ATTIC_CACHE" < "$RUNNER_TEMP/built-paths"
